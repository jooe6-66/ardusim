services:
  - type: web
    name: ardusim-compiler
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: https://ardusim.pages.dev,https://*.ardusim.pages.dev,http://localhost:5173,http://127.0.0.1:5173
      - key: MAX_CONCURRENT_COMPILES
        value: "1"
      - key: MAX_QUEUE_SIZE
        value: "24"
      - key: RATE_LIMIT_PER_MIN
        value: "120"
      - key: COMPILE_TIMEOUT_MS
        value: "60000"
